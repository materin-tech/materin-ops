# Materin Ops 全栈部署：MySQL + 后端(Spring Boot) + 前端(nginx)
# 用法：
#   docker compose up -d --build          # 构建并启动全栈
#   docker compose logs -f backend        # 跟踪后端日志
#   docker compose down                   # 停止（保留数据卷）
# 说明：
#   - 数据库 DDL 全部由后端启动时的 Flyway 迁移执行，此处只负责创建空库
#   - 镜像统一走 daocloud 镜像源（docker hub 直连不稳定）

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: materin-ops-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-materin_ops}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 映射到宿主机便于本地调试；生产环境建议删除此映射
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: materin-ops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      # 映射到宿主机便于本地调试；生产环境建议删除此映射
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: materin-ops-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-materin_ops}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  h5:
    build:
      context: ..
      dockerfile: h5/Dockerfile
    image: materin-h5:latest
    container_name: materin-ops-h5
    restart: unless-stopped
    ports:
      - "${H5_PORT:-81}:80"
    depends_on:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend/Dockerfile
    container_name: materin-ops-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
