apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: materin-ops
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: materin-ops
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # 等待 MySQL/Redis 就绪后再启动（Flyway 迁移依赖数据库）
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "for i in $(seq 1 60); do nc -z mysql 3306 && nc -z redis 6379 && exit 0; sleep 2; done; exit 1"]
      containers:
        - name: backend
          image: ghcr.io/materin-tech/materin-ops-backend:v1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secret }
          volumeMounts:
            - name: files
              mountPath: /data/files
          startupProbe:
            # Flyway 迁移 + Spring 启动，给足冷启动时间
            tcpSocket: { port: 8080 }
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: backend-files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-files
  namespace: materin-ops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
